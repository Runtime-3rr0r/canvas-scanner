name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Frontmatter + PII validation
        shell: bash
        run: |
          python3 - <<'EOF'
          import glob, re, sys, base64
          # 1) every SKILL.md parses as YAML frontmatter
          import yaml
          for p in glob.glob("skills/**/SKILL.md", recursive=True):
              txt = open(p, encoding="utf-8").read()
              if not txt.startswith("---"):
                  print("NO FRONTMATTER:", p); sys.exit(1)
              _, fm, _body = txt.split("---", 2)
              d = yaml.safe_load(fm)
              if not isinstance(d, dict) or not d.get("name"):
                  print("BAD FRONTMATTER:", p); sys.exit(1)
              print("ok frontmatter:", p, "->", d["name"])

          # 2) PII gate - fail if real identifiers leak (pattern list encoded, mirrors scripts/sanitize.py)
          LEAKS = re.compile(base64.b64decode("").decode(), re.I)
          bad = []
          for p in glob.glob("**/*", recursive=True):
              pn = p.replace("\\", "/")
              if ".git/" in pn or pn == "scripts/sanitize.py" or pn.startswith(".github"):
                  continue
              try:
                  for i, line in enumerate(open(p, encoding="utf-8", errors="replace"), 1):
                      if LEAKS.search(line):
                          bad.append(f"{p}:{i}: {line.strip()[:80]}")
              except Exception:
                  pass
          if bad:
              print("PII LEAK - refusing:")
              [print("  ", x) for x in bad]
              sys.exit(1)
          print("CI VALIDATION PASSED")
          EOF
